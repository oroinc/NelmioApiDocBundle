framework:
    secret:        test
    test:          ~
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        resource: "%kernel.project_dir%/config/routing.yml"
        utf8: true
    validation:
        enabled: true
    form: ~

# Twig Configuration
twig:
    debug:            '%kernel.debug%'
    strict_variables: '%kernel.debug%'

jms_serializer:
    property_naming:
        separator:  _
        lower_case: true

nelmio_api_doc:
    sandbox:
        authentication:
            delivery: header
            name: access_token
    cache:
        enabled: true
    exclude_sections: ["private", "exclusive"]
    swagger:
        api_base_path: /api
        swagger_version: 1.2
        api_version: 3.14
        info:
            title: Nelmio Swagger
            description: Testing Swagger integration.
            TermsOfServiceUrl: https://github.com
            contact: user@domain.tld
            license: MIT
            licenseUrl: http://opensource.org/licenses/MIT

parameters:
    domain_prod: test.com
    domain_dev: test.dev

services:
    _defaults:
        public: true

    annotation_reader:
        class: Doctrine\Common\Annotations\AnnotationReader

    Nelmio\ApiDocBundle\Tests\Fixtures\Controller\TestController:
        tags: ['controller.service_arguments']

    Nelmio\ApiDocBundle\Tests\Fixtures\Controller\ResourceController:
        tags: ['controller.service_arguments']

    nelmio.test.controller:
        class: Nelmio\ApiDocBundle\Tests\Fixtures\Controller\TestServiceController
        tags: ['controller.service_arguments']

    Nelmio\ApiDocBundle\Tests\Fixtures\Form\DependencyType:
        arguments: [['foo', 'bar']]
        tags: ['form.type']
